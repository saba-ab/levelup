# Layer 2 of the three-layer boundary enforcement (PRD §9).
#
# Division of labour: depguard carries the prefix-shaped rules (platform
# purity, broker confinement, casbin confinement, shared purity); the
# EXACT per-module import graph — "only your own subtree plus other modules'
# contracts/" — needs path-pair precision that prefix matching cannot
# express, and lives in test/arch (Layer 3). The compiler's internal/ rule
# is Layer 1 and needs no configuration at all.
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*github.com/rabbitmq/amqp091-go.Channel).Close
        - (*database/sql.DB).Close
        - (net.Listener).Close
        - (*levelup/internal/platform/rabbit.Conn).Close
    depguard:
      rules:
        # Infrastructure knows no application shape: a platform package
        # importing a module (or config, or the composition root) is a
        # dependency arrow pointing the wrong way (PRD §9 platform-purity).
        platform-purity:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: "levelup/internal/modules"
              desc: "platform must never depend on business modules"
            - pkg: "levelup/internal/app"
              desc: "platform must not know the composition root"
            - pkg: "levelup/internal/config"
              desc: "platform takes primitives; the composition root adapts config"

        # P3: the outbox dispatcher is the only publisher. A module that
        # imports the broker has re-created the dual-write problem the
        # outbox exists to solve (PRD §4).
        no-direct-broker:
          files:
            - "**/internal/modules/**"
          deny:
            - pkg: "levelup/internal/platform/rabbit"
              desc: "modules never touch the broker: events go through Deps.Outbox (P3)"
            - pkg: "github.com/rabbitmq/amqp091-go"
              desc: "modules never speak AMQP (P3)"

        # §7.6 constraint 1: exactly one file imports casbin.
        casbin-confined:
          files:
            - "$all"
            - "!**/internal/platform/authz/**"
          deny:
            - pkg: "github.com/casbin"
              desc: "casbin lives behind authz.Enforcer; import levelup/internal/platform/authz instead"

        # shared/ stays dependency-free (PRD §14): the moment it imports
        # inward it stops being shared and starts being a dumping ground.
        shared-purity:
          files:
            - "**/internal/shared/**"
          deny:
            - pkg: "levelup/internal/platform"
              desc: "shared/ must not depend on platform"
            - pkg: "levelup/internal/modules"
              desc: "shared/ must not depend on modules"
            - pkg: "levelup/internal/app"
              desc: "shared/ must not depend on the composition root"
            - pkg: "levelup/internal/config"
              desc: "shared/ must not depend on config"

        # Modules receive everything through Deps + their own Config struct;
        # reaching into global config or the composition root is coupling
        # the registry exists to prevent (PRD §7.3).
        modules-no-composition:
          files:
            - "**/internal/modules/**"
          deny:
            - pkg: "levelup/internal/config"
              desc: "modules own their Config struct; the root embeds it (PRD §7.3)"
            - pkg: "levelup/internal/app"
              desc: "modules never see the composition root"

  exclusions:
    generated: lax
    paths:
      - internal/app/wire_gen.go
      - ".*/mocks/.*"
      - api/docs

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
