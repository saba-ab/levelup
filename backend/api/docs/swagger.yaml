info:
  contact: {}
  description: Modular monolith blueprint API.
  title: LevelUp API
  version: "1.0"
paths:
  /activities:
    get:
      parameters:
      - description: Page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      - description: Cursor from next_cursor
        in: query
        name: cursor
        type: string
      - description: Filter by event type
        in: query
        name: event_type
        type: string
      - description: Filter by player external id
        in: query
        name: player_external_id
        type: string
      - description: pending | decided | rejected
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.ListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: List activities
      tags:
      - activity
    post:
      consumes:
      - application/json
      description: Stores the activity once per (tenant, event_id) and hands it to
        rules asynchronously. A repeated event_id returns the stored activity with
        duplicate=true and publishes nothing.
      parameters:
      - description: Activity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_activity_internal_transport.IngestReq'
      produces:
      - application/json
      responses:
        "200":
          description: duplicate event_id
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.IngestResp'
        "202":
          description: accepted, decision pending
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.IngestResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: validation, unknown_event_type, occurred_at_in_future, occurred_at_too_old,
            properties_too_large
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Ingest an activity
      tags:
      - activity
  /activities/{id}:
    get:
      parameters:
      - description: Activity id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.ActivityResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Get an activity with its decision status
      tags:
      - activity
  /activities/batch:
    post:
      consumes:
      - application/json
      description: Each item is validated and stored independently; per-item results
        carry either the activity id or an error.
      parameters:
      - description: Activities
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_activity_internal_transport.BatchReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.BatchResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Ingest up to 100 activities
      tags:
      - activity
  /activities/last-seen:
    get:
      description: For up to 100 player ids, the occurred_at and event_type of each
        player's most recent activity. Players with no activity resolved to them are
        absent. Order follows player_ids.
      parameters:
      - description: Comma-separated player ids (uuid), at most 100
        in: query
        name: player_ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.LastSeenListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: code invalid_player_ids
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Last activity per player
      tags:
      - activity
  /ai/drafts:
    post:
      consumes:
      - application/json
      description: Returns up to count validated drafts shaped exactly like the owning
        module's create request. Drafts are not persisted. Counts against the tenant's
        daily AI request limit.
      parameters:
      - description: Draft request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_ai_internal_transport.DraftReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_ai_internal_transport.DraftResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: invalid input, ai_refused, ai_output_truncated, invalid_context
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "429":
          description: ai_quota_exceeded
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "503":
          description: ai_not_configured, ai_unavailable, ai_bad_output
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Draft gamification entities with AI
      tags:
      - ai
  /ai/templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_ai_internal_transport.TemplateListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: List AI Hub prompt templates
      tags:
      - ai
  /ai/usage:
    get:
      parameters:
      - description: History window in days, today included (default 30, max 90)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_ai_internal_transport.UsageResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: AI usage and daily quota of the current tenant
      tags:
      - ai
  /analytics/engagement:
    get:
      description: Badges per day, missions started/completed, levels reached, rewards
        claimed and top event types over an inclusive UTC day range (max 366 days).
      parameters:
      - description: First day (YYYY-MM-DD or RFC 3339)
        in: query
        name: from
        type: string
      - description: Last day (YYYY-MM-DD or RFC 3339), default today
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.EngagementResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Analytics engagement
      tags:
      - analytics
  /analytics/funnel:
    get:
      description: 'Players who did each event type in order within an inclusive UTC
        day range (max 366 days). Approximation: order is resolved per UTC day from
        daily activity, so steps on the same day count as in order.'
      parameters:
      - description: 2-10 comma-separated event types, e.g. signup,first_purchase,repeat_purchase
        in: query
        name: steps
        required: true
        type: string
      - description: First day (YYYY-MM-DD or RFC 3339)
        in: query
        name: from
        type: string
      - description: Last day (YYYY-MM-DD or RFC 3339), default today
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FunnelResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
