    properties:
      data:
        items:
          $ref: '#/definitions/internal_modules_rules_internal_transport.VersionResp'
        type: array
      next_cursor:
        type: string
    type: object
  internal_modules_rules_internal_transport.VersionResp:
    properties:
      actions:
        items:
          type: object
        type: array
      conditions:
        type: object
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      limits:
        type: object
      published:
        type: boolean
      published_at:
        type: string
      rule_id:
        type: string
      version:
        type: integer
    type: object
  internal_modules_streaks_internal_transport.CreateReq:
    properties:
      activity_key:
        maxLength: 100
        type: string
      description:
        maxLength: 1000
        type: string
      grace_periods:
        maximum: 30
        minimum: 0
        type: integer
      is_active:
        type: boolean
      milestones:
        items:
          $ref: '#/definitions/internal_modules_streaks_internal_transport.MilestoneDTO'
        maxItems: 50
        type: array
      name:
        maxLength: 255
        type: string
      period:
        enum:
        - daily
        - weekly
        - monthly
        type: string
      points_per_period:
        minimum: 0
        type: integer
      slug:
        maxLength: 100
        type: string
    required:
    - activity_key
    - name
    - period
    type: object
  internal_modules_streaks_internal_transport.MilestoneDTO:
    properties:
      bonus_points:
        minimum: 0
        type: integer
      count:
        minimum: 1
        type: integer
    required:
    - count
    type: object
  internal_modules_streaks_internal_transport.PlayerStreakListResp:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_modules_streaks_internal_transport.PlayerStreakResp'
        type: array
      next_cursor:
        type: string
    type: object
  internal_modules_streaks_internal_transport.PlayerStreakResp:
    properties:
      broken_at:
        type: string
      current_count:
        type: integer
      id:
        type: string
      last_period_start:
        type: string
      longest_count:
        type: integer
      player_id:
        type: string
      run_started_at:
        type: string
      streak:
        $ref: '#/definitions/internal_modules_streaks_internal_transport.StreakResp'
      streak_id:
        type: string
    type: object
  internal_modules_streaks_internal_transport.RecordReq:
    properties:
      occurred_at:
        description: defaults to now; decides the period bucket
        type: string
      player_id:
        type: string
    required:
    - player_id
    type: object
  internal_modules_streaks_internal_transport.RecordResp:
    properties:
      milestones_reached:
        items:
          type: integer
        type: array
      new_period:
        type: boolean
      outcome:
        description: |-
          Outcome: recorded (new period), noop (period already recorded) or
          duplicate (Idempotency-Key replay).
        type: string
      period_start:
        type: string
      player_streak:
        $ref: '#/definitions/internal_modules_streaks_internal_transport.PlayerStreakResp'
    type: object
  internal_modules_streaks_internal_transport.StreakListResp:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_modules_streaks_internal_transport.StreakResp'
        type: array
      next_cursor:
        type: string
    type: object
  internal_modules_streaks_internal_transport.StreakResp:
    properties:
      activity_key:
        type: string
      created_at:
        type: string
      description:
        type: string
      grace_periods:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      milestones:
        items:
          $ref: '#/definitions/internal_modules_streaks_internal_transport.MilestoneDTO'
        type: array
      name:
        type: string
      period:
        type: string
      points_per_period:
        type: integer
      slug:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_streaks_internal_transport.UpdateReq:
    properties:
      activity_key:
        maxLength: 100
        minLength: 1
        type: string
      description:
        maxLength: 1000
        type: string
      grace_periods:
        maximum: 30
        minimum: 0
        type: integer
      is_active:
        type: boolean
      milestones:
        items:
          $ref: '#/definitions/internal_modules_streaks_internal_transport.MilestoneDTO'
        maxItems: 50
        type: array
      name:
        maxLength: 255
        minLength: 1
        type: string
      points_per_period:
        minimum: 0
        type: integer
      slug:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  levelup_internal_platform_httpx.Problem:
    properties:
      code:
        type: string
      detail:
        type: string
      errors:
        additionalProperties:
          type: string
        type: object
      status:
        type: integer
      title:
        type: string
      trace_id:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
  description: Modular monolith blueprint API.
  title: LevelUp API
  version: "1.0"
paths:
  /activities:
    get:
      parameters:
      - description: Page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      - description: Cursor from next_cursor
        in: query
        name: cursor
        type: string
      - description: Filter by event type
        in: query
        name: event_type
        type: string
      - description: Filter by player external id
        in: query
        name: player_external_id
        type: string
      - description: pending | decided | rejected
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.ListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: List activities
      tags:
      - activity
    post:
      consumes:
      - application/json
      description: Stores the activity once per (tenant, event_id) and hands it to
        rules asynchronously. A repeated event_id returns the stored activity with
        duplicate=true and publishes nothing.
      parameters:
      - description: Activity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_activity_internal_transport.IngestReq'
      produces:
      - application/json
      responses:
        "200":
          description: duplicate event_id
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.IngestResp'
        "202":
          description: accepted, decision pending
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.IngestResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: validation, unknown_event_type, occurred_at_in_future, occurred_at_too_old,
            properties_too_large
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Ingest an activity
      tags:
      - activity
  /activities/{id}:
    get:
      parameters:
      - description: Activity id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.ActivityResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Get an activity with its decision status
      tags:
      - activity
  /activities/batch:
    post:
      consumes:
      - application/json
      description: Each item is validated and stored independently; per-item results
        carry either the activity id or an error.
      parameters:
      - description: Activities
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_activity_internal_transport.BatchReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_modules_activity_internal_transport.BatchResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Ingest up to 100 activities
      tags:
      - activity
  /api-keys:
    get:
      parameters:
      - description: Page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_identity_internal_transport.APIKeyListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: List the tenant's API keys (secrets are never returned)
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: 'The secret is returned once. Keys authenticate with "Authorization:
        Bearer lvl_live_…" or "X-API-Key". Requires a signed-in admin (not another
        key).'
      parameters:
      - description: Key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_identity_internal_transport.CreateAPIKeyReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_identity_internal_transport.CreatedAPIKeyResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Create an API key for the tenant's backend
      tags:
      - api-keys
  /api-keys/{id}:
    delete:
      parameters:
      - description: API key id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Revoke an API key (idempotent; effective on the next request)
      tags:
      - api-keys
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_identity_internal_transport.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_identity_internal_transport.SessionResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      description: Deny-lists the presented access token and revokes every refresh
        token of the user.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Log out everywhere
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_identity_internal_transport.MeResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: The authenticated user, roles and tenant
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Consumes the refresh token and returns a new pair; a replayed token
        revokes every session of the user.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_identity_internal_transport.RefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_identity_internal_transport.SessionResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      summary: Rotate a refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Atomically creates the tenant, the owner user and the owner role,
        and returns a session.
      parameters:
      - description: Registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_identity_internal_transport.RegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_identity_internal_transport.SessionResp'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      summary: Register a tenant and its owner
      tags:
      - auth
  /badges:
    get:
      description: Newest first, keyset paginated. Secret and inactive badges are
        included with their flags.
      parameters:
      - description: Filter by tier
        enum:
        - bronze
        - silver
        - gold
        - platinum
        - diamond
        in: query
        name: tier
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Filter by is_active
        in: query
        name: active
        type: boolean
      - description: Page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_badges_internal_transport.BadgeListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: List badges
      tags:
      - badges
    post:
      consumes:
      - application/json
      parameters:
      - description: Badge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_badges_internal_transport.CreateBadgeReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_badges_internal_transport.BadgeResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "409":
          description: badge_slug_taken
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Create a badge
      tags:
      - badges
  /badges/{id}:
    delete:
      description: Existing holdings stay; new awards are rejected.
      parameters:
      - description: Badge id (uuid)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: badge_not_found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Delete a badge (soft)
      tags:
      - badges
    get:
      parameters:
      - description: Badge id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_badges_internal_transport.BadgeResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: badge_not_found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Get a badge
      tags:
      - badges
    patch:
      consumes:
      - application/json
      description: Omitted fields stay untouched; max_awards and requirements accept
        null to clear. The slug never changes on rename.
      parameters:
      - description: Badge id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_badges_internal_transport.UpdateBadgeReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_badges_internal_transport.BadgeResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: badge_not_found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "409":
          description: badge_slug_taken, version_conflict
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Update a badge (partial)
      tags:
      - badges
  /badges/{id}/award:
    post:
      consumes:
      - application/json
      description: Idempotency-Key is optional; with it a retry returns the original
        outcome (200, replay=true). Points (points_value > 0) are credited asynchronously
        by the points module.
      parameters:
      - description: Badge id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: Client idempotency key
        in: header
        name: Idempotency-Key
        type: string
      - description: Player
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_modules_badges_internal_transport.AwardReq'
      produces:
      - application/json
      responses:
        "200":
          description: replay
          schema:
            $ref: '#/definitions/internal_modules_badges_internal_transport.AwardResp'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_modules_badges_internal_transport.AwardResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: badge_not_found, player_not_found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "409":
          description: badge_already_earned, badge_max_awards_reached, badge_inactive,
            player_inactive
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Award a badge to a player
      tags:
      - badges
  /badges/{id}/players/{playerID}:
    delete:
      description: Removes every stack. Points credited by the badge are NOT taken
        back. 204 also when the player did not hold it.
      parameters:
      - description: Badge id (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: Player id (uuid)
        in: path
        name: playerID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "404":
          description: badge_not_found, player_not_found
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Revoke a badge from a player
      tags:
      - badges
  /event-categories:
    get:
      description: Own plus global categories ordered by sort_order, name. Not paged;
        next_cursor is always empty.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_eventcatalog_internal_transport.CategoryListResp'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
