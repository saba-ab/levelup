        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/levelup_internal_platform_httpx.Problem'
      security:
      - BearerAuth: []
      summary: Retention cohorts
      tags:
      - analytics
