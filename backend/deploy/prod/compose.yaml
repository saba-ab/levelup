# Production stack for one host (docs/rewrite/DEPLOY.md). Everything except
# the API is on the private network; the API listens on 127.0.0.1 only and
# Caddy terminates TLS in front of it. Secrets come from ./.env (never
# committed; .env.example lists them).
name: levelup

networks:
  levelup:
    ipam:
      config:
        - subnet: 172.29.0.0/24

x-app: &app
  image: levelup-backend:${LEVELUP_IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  networks: [levelup]
  depends_on:
    pgbouncer: { condition: service_started }
    redis-core: { condition: service_healthy }
    redis-cache: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      levelup:
        # pgbouncer's resolver cannot reliably resolve compose names.
        ipv4_address: 172.29.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: 172.29.0.10
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    networks: [levelup]
    depends_on:
      postgres: { condition: service_healthy }

  redis-core:
    # Correctness store (sessions, locks, rate limits, dedupe): never evicts.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    networks: [levelup]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rediscore:/data

  redis-cache:
    # Cache only: safe to lose.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [levelup]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    hostname: levelup-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark {absolute,\"400MiB\"}"
    networks: [levelup]
    ports:
      - "127.0.0.1:15672:15672"  # management UI: Caddy → rabbit.levelupos.ge (basic auth)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
    volumes:
      - rabbitdata:/var/lib/rabbitmq

  migrate:
    <<: *app
    entrypoint: ["/app/migrate", "up"]
    restart: "no"
    profiles: [migrate]

  api:
    <<: *app
    entrypoint: ["/app/api"]
    ports:
      - "127.0.0.1:18080:8080"   # Caddy → api.levelupos.ge
      - "127.0.0.1:18081:8081"   # admin: /metrics, pprof (never public)

  worker:
    <<: *app
    entrypoint: ["/app/worker"]

  dispatcher:
    <<: *app
    entrypoint: ["/app/dispatcher"]

  scheduler:
    # Singleton: never scale beyond one replica.
    <<: *app
    entrypoint: ["/app/scheduler"]

volumes:
  pgdata:
  rediscore:
  rabbitdata:
