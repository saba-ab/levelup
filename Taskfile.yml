version: '3'

# Monorepo entrypoint. Each app owns its Taskfile (backend/Taskfile.yml loads
# backend/.env, which Task does not allow in included files), so the root
# delegates: `task be -- check`, `task be -- run`, or `cd backend && task check`.
tasks:
  default:
    cmds: [task --list]

  be:
    desc: 'Run a backend task. Usage: task be -- check'
    cmd: task -d backend {{.CLI_ARGS}}
