# One job per frontend app, path-filtered so backend-only changes skip it.
# Each app keeps its own package-lock.json (no workspace hoisting): the apps
# deploy independently with their own root directory.
name: frontend

on:
  push:
    branches: [master]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

jobs:
  build:
    name: ${{ matrix.app }} (install + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, landing]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
