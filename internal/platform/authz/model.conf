# Plain RBAC (ADR-0011). Subjects are IDs — user:{uuid}, role:{int} — never
# names: renaming a role must not change who can withdraw money (PRD §7.6).
# Objects are permission keys (module:action). Ownership checks live in the
# service layer, not in this matcher (§7.6 constraint 3).
[request_definition]
r = sub, obj

[policy_definition]
p = sub, obj

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj
